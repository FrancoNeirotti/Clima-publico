<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16232c" media="(prefers-color-scheme: dark)">
<!-- De dónde salen los datos. Con servidor.py es su API; al publicarse en GitHub Pages
     el workflow lo reemplaza por el estaciones.json de la rama "datos". -->
<meta name="url-datos" content="/api/estaciones">
<title>Estaciones meteorológicas de Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --tinta: #16242f;
    --tinta-suave: #52626e;
    --fondo: #e9eef0;
    --panel: #ffffff;
    --linea: #dbe2e6;
    --acento: #1f6f8b;
    --aviso: #a8540a;
    --sombra: 0 8px 28px rgba(22, 36, 47, .18);
    --numeros: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinta: #e4ebef;
      --tinta-suave: #9db0bc;
      --fondo: #0e1920;
      --panel: #16232c;
      --linea: #2a3b46;
      --acento: #63b6d3;
      --aviso: #f0a23b;
      --sombra: 0 8px 28px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    font-family: "Barlow", system-ui, sans-serif;
    color: var(--tinta);
    background: var(--fondo);
    font-size: 15px;
    line-height: 1.4;
  }
  #mapa { position: fixed; inset: 0; background: var(--fondo); }
  /* Muesca y bordes redondeados de los celulares (viewport-fit=cover). */
  .leaflet-top { top: env(safe-area-inset-top); }
  .leaflet-right { right: env(safe-area-inset-right); }
  .leaflet-bottom { bottom: env(safe-area-inset-bottom); }
  #zona-segura {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .panel {
    position: fixed; z-index: 1000;
    top: 12px; left: 12px; bottom: 12px;
    width: min(370px, calc(100% - 24px));
    display: flex; flex-direction: column;
    background: var(--panel);
    border-radius: 14px;
    box-shadow: var(--sombra);
    touch-action: manipulation;
    overflow: hidden;
  }
  .cuerpo { overscroll-behavior: contain; }

  /* Botón "cerca mío": en la computadora debajo del zoom; en el celular flota sobre la hoja. */
  .cerca {
    position: fixed; z-index: 1000;
    top: calc(84px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    background: var(--panel); color: var(--acento);
    border: 2px solid rgba(0, 0, 0, .2); border-radius: 4px;
    background-clip: padding-box;
  }
  .cerca[hidden] { display: none; }
  .cerca svg { width: 20px; height: 20px; }
  .cerca[aria-busy="true"] svg { animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .yo { background: #1a73e8; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.4); }
  .cabecera { padding: 18px 18px 12px; border-bottom: 1px solid var(--linea); }
  h1 {
    font-family: var(--numeros);
    font-weight: 700; font-size: 1.5rem; line-height: 1.1;
    margin: 0 0 4px;
  }
  .estado { margin: 0; color: var(--tinta-suave); font-size: .9rem; }
  .estado.error { color: var(--aviso); }
  .acciones { display: flex; gap: 8px; margin-top: 12px; }
  input[type="search"] {
    flex: 1; min-width: 0;
    font: inherit; color: inherit;
    padding: 8px 10px;
    border: 1px solid var(--linea); border-radius: 8px;
    background: transparent;
  }
  button {
    font: inherit; font-weight: 600; color: var(--acento);
    background: transparent;
    border: 1px solid var(--linea); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  @media (hover: hover) { button:hover { border-color: var(--acento); } }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .fuentes { padding: 10px 18px; border-bottom: 1px solid var(--linea); display: grid; gap: 6px; }
  .fuente { display: flex; align-items: baseline; gap: 8px; font-size: .92rem; cursor: pointer; }
  .fuente .cuenta { margin-left: auto; font-family: var(--numeros); color: var(--tinta-suave); }
  .fuente-nota { margin: -2px 0 2px 24px; font-size: .82rem; color: var(--aviso); }
  .fuente-nota.suave { color: var(--tinta-suave); }
  .fuentes { max-height: 34vh; overflow-y: auto; }

  .cuerpo { flex: 1; overflow-y: auto; }
  .lista { list-style: none; margin: 0; padding: 6px 0; }
  .lista button {
    width: 100%; display: flex; align-items: baseline; gap: 10px;
    border: 0; border-radius: 0; padding: 7px 18px;
    color: var(--tinta); font-weight: 500; text-align: left;
  }
  @media (hover: hover) { .lista button:hover { background: color-mix(in srgb, var(--acento) 8%, transparent); } }
  .lista button:active { background: color-mix(in srgb, var(--acento) 12%, transparent); }
  .lista .t { margin-left: auto; font-family: var(--numeros); font-weight: 600; }
  .lista .nombre { min-width: 0; }
  .lista small { display: block; font-size: .78rem; font-weight: 400; color: var(--tinta-suave); }
  .vacio { padding: 18px; color: var(--tinta-suave); }
  a { color: var(--acento); }
  .fuente a { text-decoration: none; font-size: .85rem; }
  .origen { margin: 12px 0 0; font-size: .88rem; color: var(--tinta-suave); }

  .fuentes-caja { border-bottom: 1px solid var(--linea); }
  .fuentes-caja > summary {
    padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: .92rem;
    list-style-position: inside;
  }
  .fuentes-caja > summary .resumen { font-weight: 400; color: var(--tinta-suave); }
  .fuentes-caja .fuentes { border-bottom: 0; padding-top: 0; }
  .asa { display: none; }

  .detalle { padding: 16px 18px 20px; }
  .detalle .volver { margin-bottom: 14px; }
  .detalle h2 { font-family: var(--numeros); font-weight: 600; font-size: 1.3rem; line-height: 1.15; margin: 0; }
  .detalle .sub { color: var(--tinta-suave); font-size: .88rem; margin: 2px 0 0; }
  .detalle .sub.viejo { color: var(--aviso); }
  .grande { display: flex; align-items: center; gap: 14px; margin: 16px 0 10px; }
  .grande .temp {
    font-family: var(--numeros); font-weight: 600;
    font-size: 4.2rem; line-height: .9;
    color: var(--c, var(--tinta));
  }
  .grande .cielo { font-size: 1.05rem; font-weight: 500; }
  .grande .sens { color: var(--tinta-suave); font-size: .88rem; }
  dl.datos { margin: 0; display: grid; grid-template-columns: 1fr auto; }
  dl.datos dt, dl.datos dd { padding: 9px 0; border-top: 1px solid var(--linea); margin: 0; }
  dl.datos dd { font-family: var(--numeros); font-weight: 600; font-size: 1.05rem; text-align: right; }
  .crudo {
    margin-top: 14px; padding: 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--tinta) 6%, transparent);
    font-family: ui-monospace, Consolas, monospace; font-size: .8rem;
    overflow-wrap: anywhere;
  }

  .escala { padding: 10px 18px 14px; border-top: 1px solid var(--linea); font-size: .8rem; color: var(--tinta-suave); }
  .escala .barra { height: 8px; border-radius: 4px; margin-bottom: 4px; }
  .escala .marcas { display: flex; justify-content: space-between; font-family: var(--numeros); }

  /* Marcadores: la temperatura es el marcador */
  .pin-caja { background: none; border: 0; }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    min-width: 34px; padding: 2px 6px;
    font-family: var(--numeros); font-weight: 700; font-size: 14px; line-height: 18px;
    text-align: center; white-space: nowrap;
    color: #10202a;
    background: var(--c);
    border: 1.5px solid rgba(255, 255, 255, .9);
    border-radius: 11px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    cursor: pointer;
  }
  .pin.smn { border-radius: 4px; }
  .pin.red { font-size: 12px; line-height: 15px; min-width: 28px; padding: 1px 4px; border-width: 1px; }
  .pin.privada { border-style: dashed; opacity: .9; }
  .fuentes-titulo { margin: 6px 0 0; font-size: .78rem; font-weight: 600; text-transform: uppercase;
                    letter-spacing: .04em; color: var(--tinta-suave); }
  .pin.elegido { outline: 3px solid var(--tinta); outline-offset: 1px; z-index: 1; }
  .pin.sin-dato { background: #b9c3c9; }
  /* Con el dedo, los marcadores se pueden tocar aunque sean chicos. */
  @media (pointer: coarse) {
    .pin::after { content: ""; position: absolute; inset: -9px -5px; }
    .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
    .cerca { width: 48px; height: 48px; top: calc(112px + env(safe-area-inset-top)); }
    input[type="search"], button { min-height: 44px; }
  }

  /* Celular acostado: el panel lateral se achica para dejar lugar al mapa. */
  @media (max-height: 500px) and (min-width: 701px) {
    .panel {
      top: calc(8px + env(safe-area-inset-top)); bottom: calc(8px + env(safe-area-inset-bottom));
      left: calc(8px + env(safe-area-inset-left)); width: 320px;
    }
    h1 { display: none; }
    .cabecera { padding: 12px 14px 10px; }
    .estado { font-size: .82rem; }
    .acciones { margin-top: 8px; }
    .fuentes-caja > summary { padding: 12px 14px; }
    .fuentes { padding: 6px 14px 10px; }
    .lista button { padding: 9px 14px; }
    .escala { display: none; }
  }

  /* Móvil: el panel es una hoja inferior con tres alturas (baja, media, alta). */
  @media (max-width: 700px) {
    .panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto;
      height: var(--alto-hoja); border-radius: 16px 16px 0 0;
      transition: height .25s ease;
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: visible;  /* deja ver el botón "cerca mío" que flota encima */
    }
    .panel[data-hoja="baja"] { --alto-hoja: calc(146px + env(safe-area-inset-bottom)); }
    .panel[data-hoja="media"] { --alto-hoja: 52dvh; }
    .panel[data-hoja="alta"] { --alto-hoja: calc(100dvh - 48px - env(safe-area-inset-top)); }
    .panel.arrastrando { transition: none; }
    .cuerpo { min-height: 0; }
    .asa {
      display: flex; justify-content: center; align-items: center;
      width: 100%; height: 30px; min-height: 0; padding: 0; border: 0; border-radius: 16px 16px 0 0;
      flex: none; touch-action: none; cursor: grab;
    }
    .asa span { width: 44px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--tinta) 25%, transparent); }
    .cabecera { padding: 0 14px 10px; touch-action: none; }
    h1 { display: none; }
    .estado { font-size: .8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .acciones { margin-top: 8px; }
    input[type="search"] { font-size: 16px; min-height: 44px; } /* menos de 16px hace que iOS haga zoom al tocar */
    button { padding: 9px 12px; min-height: 44px; }
    .fuentes-caja > summary { padding: 0 14px; min-height: 44px; display: flex; align-items: center; gap: 6px; }
    .fuentes-caja > summary::before { content: "▸"; transition: transform .2s; }
    .fuentes-caja[open] > summary::before { transform: rotate(90deg); }
    .fuentes-caja > summary::-webkit-details-marker { display: none; }
    .fuentes-caja > summary { list-style: none; }
    .fuentes { padding: 0 14px 10px; max-height: none; gap: 0; }
    .fuente { align-items: center; min-height: 44px; padding: 0; }
    .fuente input { width: 20px; height: 20px; margin: 0 4px 0 0; flex: none; }
    .fuente a { display: grid; place-items: center; min-width: 36px; min-height: 44px; margin: 0 -8px; }
    .fuente-nota { margin: -6px 0 6px 28px; }
    .lista button { padding: 11px 14px; min-height: 52px; }
    .detalle { padding: 4px 14px 20px; }
    .detalle .volver { margin-bottom: 10px; }
    .grande .temp { font-size: 3.4rem; }
    .escala { display: none; }
    .leaflet-control-zoom { display: none; }
    /* Viendo una estación se esconde la búsqueda para que el detalle entre en la hoja. */
    .panel.con-detalle .cabecera, .panel.con-detalle .fuentes-caja { display: none; }
    .cerca {
      position: absolute; top: -58px; right: calc(12px + env(safe-area-inset-right));
      width: 46px; height: 46px; min-height: 0;
      border: 0; border-radius: 50%; box-shadow: var(--sombra);
      transition: opacity .2s;
    }
    .cerca svg { width: 22px; height: 22px; }
    .panel[data-hoja="alta"] .cerca { opacity: 0; pointer-events: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
    .panel, .cerca, .fuentes-caja > summary::before { transition: none !important; }
  }
</style>
</head>
<body>
<div id="mapa" role="application" aria-label="Mapa de estaciones"></div>
<div id="zona-segura" aria-hidden="true"></div>

<aside class="panel" id="panel" data-hoja="baja">
  <button type="button" class="cerca" id="cerca" hidden aria-label="Estaciones cerca mío" title="Estaciones cerca mío">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      <path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
    </svg>
  </button>
  <button type="button" class="asa" id="asa" aria-label="Agrandar o achicar el panel"><span></span></button>
  <div class="cabecera">
    <h1>Estaciones de Argentina</h1>
    <p class="estado" id="estado">Cargando datos…</p>
    <div class="acciones">
      <input type="search" id="buscar" placeholder="Buscar estación o localidad" aria-label="Buscar estación"
             enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
      <button type="button" id="actualizar">Actualizar</button>
    </div>
  </div>
  <details class="fuentes-caja" id="fuentes-caja">
    <summary>Fuentes <span class="resumen" id="fuentes-resumen"></span></summary>
    <div class="fuentes" id="fuentes"></div>
  </details>
  <div class="cuerpo" id="cuerpo"></div>
  <div class="escala" aria-hidden="true">
    <div class="barra" id="barra"></div>
    <div class="marcas"><span>−10°</span><span>0°</span><span>10°</span><span>20°</span><span>30°</span><span>40°</span></div>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ZONA = "America/Argentina/Buenos_Aires";
const REFRESCO_MS = 5 * 60 * 1000;
const REINTENTO_CARGANDO_MS = 5000;
const URL_DATOS = document.querySelector('meta[name="url-datos"]').content;
// Sin servidor.py (sitio estático) no se puede pedir que consulte las fuentes en el momento.
const CON_SERVIDOR = URL_DATOS.startsWith("/api/");
const HORAS_VIEJO = 3;
// Redes oficiales del SMN y aeropuertos: se dibujan más grandes y por encima del resto.
const OFICIALES = new Set(["metar", "smn", "synop"]);

const fmt = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 1 });
const fmtHora = new Intl.DateTimeFormat("es-AR", { timeZone: ZONA, hour: "2-digit", minute: "2-digit" });
const fmtFecha = new Intl.DateTimeFormat("es-AR", { timeZone: ZONA, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// Escala de temperatura (°C → color)
const ESCALA = [[-10, [74, 92, 196]], [0, [96, 150, 220]], [10, [118, 200, 205]],
                [18, [150, 212, 120]], [25, [242, 196, 78]], [32, [236, 122, 58]], [40, [190, 52, 60]]];
function colorTemp(t) {
  if (t == null) return null;
  if (t <= ESCALA[0][0]) return `rgb(${ESCALA[0][1]})`;
  for (let i = 1; i < ESCALA.length; i++) {
    const [t1, c1] = ESCALA[i];
    if (t <= t1) {
      const [t0, c0] = ESCALA[i - 1];
      const k = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k))})`;
    }
  }
  return `rgb(${ESCALA[ESCALA.length - 1][1]})`;
}
document.getElementById("barra").style.background =
  `linear-gradient(to right, ${ESCALA.map(([t]) => `${colorTemp(t)} ${((t + 10) / 50) * 100}%`).join(", ")})`;

const RUMBOS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSO", "SO", "OSO", "O", "ONO", "NO", "NNO"];
const rumbo = g => RUMBOS[Math.round(g / 22.5) % 16];

function relativo(iso) {
  if (!iso) return { texto: "Hora desconocida", viejo: true };
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  const hoy = fmtFecha.format(new Date()).split(",")[0] === fmtFecha.format(new Date(iso)).split(",")[0];
  const hora = hoy ? fmtHora.format(new Date(iso)) : fmtFecha.format(new Date(iso));
  const hace = min < 60 ? `hace ${Math.max(min, 0)} min` : `hace ${Math.round(min / 60)} h`;
  return { texto: `Observado ${hora} (${hace})`, viejo: min > HORAS_VIEJO * 60 };
}

function el(etiqueta, props = {}, ...hijos) {
  const n = document.createElement(etiqueta);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const h of hijos) if (h != null) n.append(h);
  return n;
}

// --- Mapa ---
const movil = matchMedia("(max-width: 700px)");
const panel = document.getElementById("panel");
const mapa = L.map("mapa", { zoomControl: false, minZoom: 3, worldCopyJump: true, attributionControl: false });
L.control.attribution({ position: movil.matches ? "topright" : "bottomright" }).addTo(mapa);
mapa.fitBounds([[-55.2, -73.6], [-21.7, -53.6]], movil.matches
  ? { paddingTopLeft: [0, 20], paddingBottomRight: [0, panel.getBoundingClientRect().height + 20] }
  : { paddingTopLeft: [panel.getBoundingClientRect().right + 10, 0] });
L.control.zoom({ position: "topright" }).addTo(mapa);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(mapa);
const capa = L.layerGroup().addTo(mapa);
// Con zoom bajo se dibuja una estación por celda de pantalla (la de mayor prioridad):
// miles de marcadores superpuestos no se leen y hacen lento el mapa.
const ZOOM_TODAS = 10;
// Con el dedo se deja más lugar entre marcadores para no tocar el de al lado.
const CELDA_PX = matchMedia("(pointer: coarse)").matches ? 44 : 36;
const LISTA_INICIAL = 200;
const marcadores = new Map(); // id -> { marcador, html, z }

const estado = { datos: null, etag: null, ocultas: new Set(), filtro: "", elegida: null,
                 porId: new Map(), prioridad: new Map(), tipo: new Map(), fuentes: new Map(),
                 enVista: null, listaCompleta: false, ubicacion: null };

// --- Hoja inferior (móvil) ---
const HOJAS = ["baja", "media", "alta"];
function hoja(nombre) {
  if (!movil.matches || panel.dataset.hoja === nombre) return;
  panel.dataset.hoja = nombre;
}
// Altura final de cada estado de la hoja (no la actual, que puede estar en transición).
// Tiene que coincidir con los --alto-hoja del CSS.
function alturas() {
  const seguro = getComputedStyle(document.getElementById("zona-segura"));
  const abajo = parseFloat(seguro.paddingBottom) || 0, arriba = parseFloat(seguro.paddingTop) || 0;
  const alto = window.innerHeight;
  return { baja: 146 + abajo, media: alto * 0.52, alta: alto - 48 - arriba };
}
function altoHoja() {
  if (!movil.matches) return 0;
  return alturas()[panel.dataset.hoja];
}
// Se arrastra desde el asa o desde cualquier parte libre de la cabecera.
// Un toque en el asa alterna las alturas; un deslizamiento rápido pasa a la siguiente.
(() => {
  const asa = document.getElementById("asa");
  const cabecera = panel.querySelector(".cabecera");
  let inicio = null;
  function empezar(ev, capturar) {
    if (!movil.matches || (ev.pointerType === "mouse" && ev.button !== 0)) return;
    inicio = { y: ev.clientY, alto: panel.getBoundingClientRect().height, movio: false,
               id: ev.pointerId, nodo: ev.currentTarget, capturar, muestras: [[ev.timeStamp, ev.clientY]] };
    if (capturar) { ev.currentTarget.setPointerCapture(ev.pointerId); panel.classList.add("arrastrando"); }
  }
  function mover(ev) {
    if (!inicio || ev.pointerId !== inicio.id) return;
    const dy = inicio.y - ev.clientY;
    if (!inicio.movio && Math.abs(dy) > 6) {
      inicio.movio = true;
      if (!inicio.capturar) { inicio.nodo.setPointerCapture(ev.pointerId); panel.classList.add("arrastrando"); }
    }
    if (!inicio.movio) return;
    inicio.muestras.push([ev.timeStamp, ev.clientY]);
    if (inicio.muestras.length > 5) inicio.muestras.shift();
    panel.style.height = `${Math.max(90, Math.min(window.innerHeight - 40, inicio.alto + dy))}px`;
  }
  function soltar(ev) {
    if (!inicio || ev.pointerId !== inicio.id) return;
    panel.classList.remove("arrastrando");
    const final = panel.getBoundingClientRect().height;
    panel.style.height = "";
    if (!inicio.movio) {
      if (inicio.nodo === asa && ev.type === "pointerup") hoja(HOJAS[(HOJAS.indexOf(panel.dataset.hoja) + 1) % HOJAS.length]);
    } else {
      const [t0, y0] = inicio.muestras[0], [t1, y1] = inicio.muestras[inicio.muestras.length - 1];
      const velocidad = t1 > t0 ? (y0 - y1) / (t1 - t0) : 0;  // px/ms, positiva hacia arriba
      const h = alturas();
      const orden = [...HOJAS].sort((a, b) => h[a] - h[b]);
      let destino;
      if (Math.abs(velocidad) > 0.5) {
        destino = velocidad > 0 ? orden.find(n => h[n] > final + 10) || "alta"
                                : [...orden].reverse().find(n => h[n] < final - 10) || "baja";
      } else {
        destino = orden.reduce((a, b) => Math.abs(h[a] - final) <= Math.abs(h[b] - final) ? a : b);
      }
      hoja(destino);
    }
    inicio = null;
  }
  asa.addEventListener("pointerdown", ev => empezar(ev, true));
  cabecera.addEventListener("pointerdown", ev => {
    if (!ev.target.closest("input, button, a, select, textarea")) empezar(ev, false);
  });
  for (const nodo of [asa, cabecera]) {
    nodo.addEventListener("pointermove", mover);
    nodo.addEventListener("pointerup", soltar);
    nodo.addEventListener("pointercancel", soltar);
  }
})();
// Al mover el mapa con la hoja bien alta, se baja para dejarlo ver.
mapa.on("dragstart", () => { if (panel.dataset.hoja === "alta") hoja("media"); });

// Centra el mapa en un punto dejando a la vista la parte que no tapa la hoja inferior.
function centrar(latlng, zoom) {
  const opciones = { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.8 };
  const alto = altoHoja();
  if (!alto) return mapa.flyTo(latlng, zoom, opciones);
  const destino = mapa.unproject(mapa.project(latlng, zoom).add([0, alto / 2]), zoom);
  mapa.flyTo(destino, zoom, opciones);
}

function nombreFuente(id) {
  return (estado.fuentes.get(id) || {}).nombre || id;
}

// Solo se usan como enlace direcciones web (nunca javascript: u otros esquemas).
function enlaceSeguro(url) {
  return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
}

function enlaceExterno(url, texto) {
  return el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, texto);
}

function normalizar(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// Índices que se arman una vez por cada respuesta nueva del servidor.
function prepararDatos(d) {
  estado.porId = new Map(d.estaciones.map(e => [e.id, e]));
  estado.prioridad = new Map(d.fuentes.map((f, i) => [f.id, i]));
  estado.tipo = new Map(d.fuentes.map(f => [f.id, f.tipo]));
  estado.fuentes = new Map(d.fuentes.map(f => [f.id, f]));
  for (const e of d.estaciones) e._nombre = normalizar(e.nombre);
}

function visibles() {
  if (!estado.datos) return [];
  const f = normalizar(estado.filtro);
  return estado.datos.estaciones.filter(e => !estado.ocultas.has(e.fuente) && (!f || e._nombre.includes(f)));
}

function esPrivada(e) {
  return estado.tipo.get(e.fuente) === "privada";
}

// Menor es más importante: la elegida, después por orden de fuente y las que tienen temperatura.
function prioridad(e) {
  if (e.id === estado.elegida) return -1;
  return (estado.prioridad.get(e.fuente) ?? 99) + (e.temp_c == null ? 100 : 0);
}

function htmlPin(e) {
  const t = e.temp_c == null ? "—" : `${Math.round(e.temp_c)}°`;
  const clases = ["pin", ["smn", "synop"].includes(e.fuente) ? "smn" : "", OFICIALES.has(e.fuente) ? "" : "red",
                  esPrivada(e) ? "privada" : "",
                  e.temp_c == null ? "sin-dato" : "", estado.elegida === e.id ? "elegido" : ""].filter(Boolean).join(" ");
  const color = colorTemp(e.temp_c) || "#b9c3c9";
  return `<span class="${clases}" style="--c:${color}">${t}</span>`;
}

function icono(html) {
  return L.divIcon({ className: "pin-caja", iconSize: null, html });
}

function dibujarMapa() {
  if (!estado.datos) return;
  const zoom = mapa.getZoom();
  const vista = mapa.getBounds().pad(0.25);
  let lista = visibles().filter(e => vista.contains([e.lat, e.lon]));
  const enVista = lista.length;
  if (zoom < ZOOM_TODAS) {
    lista.sort((a, b) => prioridad(a) - prioridad(b));
    const ocupadas = new Set();
    lista = lista.filter(e => {
      const p = mapa.project([e.lat, e.lon], zoom);
      const celda = `${Math.floor(p.x / CELDA_PX)}:${Math.floor(p.y / CELDA_PX)}`;
      if (ocupadas.has(celda) && e.id !== estado.elegida) return false;
      ocupadas.add(celda);
      return true;
    });
  }

  // Se reusan los marcadores existentes y solo se tocan los que cambiaron.
  const quedan = new Set(lista.map(e => e.id));
  for (const [id, m] of marcadores) {
    if (!quedan.has(id)) { capa.removeLayer(m.marcador); marcadores.delete(id); }
  }
  for (const e of lista) {
    const html = htmlPin(e);
    const z = estado.elegida === e.id ? 2000 : (OFICIALES.has(e.fuente) ? 500 : 0);
    const m = marcadores.get(e.id);
    if (!m) {
      const marcador = L.marker([e.lat, e.lon], { icon: icono(html), title: `${e.nombre} · ${nombreFuente(e.fuente)}`,
                                                 keyboard: true, riseOnHover: true, zIndexOffset: z })
        .on("click", () => elegir(e.id, false))
        .addTo(capa);
      marcadores.set(e.id, { marcador, html, z });
    } else {
      if (m.html !== html) { m.marcador.setIcon(icono(html)); m.html = html; }
      if (m.z !== z) { m.marcador.setZIndexOffset(z); m.z = z; }
    }
  }
  estado.enVista = { dibujadas: lista.length, total: enVista };
  dibujarEstado();
}
mapa.on("moveend", dibujarMapa);

// --- Panel ---
function dibujarEstado() {
  const nodo = document.getElementById("estado");
  const d = estado.datos;
  if (!d) return;
  const total = d.estaciones.length;
  const cargando = d.fuentes.filter(f => f.cargando).length;
  const v = estado.enVista;
  nodo.className = "estado";
  nodo.textContent = `${total} estaciones, datos de las ${fmtHora.format(new Date(d.generado_utc))}` +
    (cargando ? ` (actualizando ${cargando} ${cargando === 1 ? "fuente" : "fuentes"}…)` : "") +
    (v && v.dibujadas < v.total ? ` · En el mapa: ${v.dibujadas} de ${v.total} en esta zona; acercá para ver todas.` : "");
}

function dibujarFuentes() {
  const caja = document.getElementById("fuentes");
  caja.replaceChildren();
  let titulo = null;
  for (const f of estado.datos.fuentes) {
    const grupo = f.tipo === "privada" ? "Redes privadas y ciudadanas" : "Redes públicas";
    if (grupo !== titulo) caja.append(el("p", { class: "fuentes-titulo" }, titulo = grupo));
    const casilla = el("input", { type: "checkbox", onchange: ev => {
      ev.target.checked ? estado.ocultas.delete(f.id) : estado.ocultas.add(f.id);
      redibujar();
    }});
    casilla.checked = !estado.ocultas.has(f.id);
    const sitio = enlaceSeguro(f.sitio);
    caja.append(el("label", { class: "fuente" }, casilla, f.nombre,
      sitio ? enlaceExterno(sitio, "↗") : null,
      el("span", { class: "cuenta" }, String(f.mostradas))));
    if (f.cargando && !f.recibidas && f.ok) caja.append(el("p", { class: "fuente-nota suave" }, "Cargando…"));
    else if (!f.ok) caja.append(el("p", { class: "fuente-nota" }, `No respondió: ${f.error}`));
    else if (f.sin_ubicar.length) caja.append(el("p", { class: "fuente-nota" },
      `${f.sin_ubicar.length} sin ubicar en el mapa (ver la consola del servidor)`));
  }
  const ocultas = estado.ocultas.size;
  document.getElementById("fuentes-resumen").textContent =
    `(${estado.datos.fuentes.length}${ocultas ? `, ${ocultas} ocultas` : ""})`;
}

function distanciaKm(e) {
  const [lat, lon] = estado.ubicacion, rad = Math.PI / 180;
  const a = Math.sin((e.lat - lat) * rad / 2) ** 2 +
            Math.cos(lat * rad) * Math.cos(e.lat * rad) * Math.sin((e.lon - lon) * rad / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
}

function dibujarLista() {
  const cuerpo = document.getElementById("cuerpo");
  panel.classList.remove("con-detalle");
  // Con la ubicación del usuario, la lista va de la más cercana a la más lejana.
  const cerca = estado.ubicacion && !estado.filtro;
  const lista = visibles();
  if (cerca) {
    for (const e of lista) e._km = distanciaKm(e);
    lista.sort((a, b) => a._km - b._km);
  } else {
    lista.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  }
  if (!lista.length) {
    cuerpo.replaceChildren(el("p", { class: "vacio" },
      estado.filtro ? "Ninguna estación coincide con la búsqueda." : "No hay estaciones para mostrar con las fuentes elegidas."));
    return;
  }
  // Armar miles de botones de una vez traba el panel: se muestran de a poco.
  const mostrar = estado.listaCompleta ? lista : lista.slice(0, LISTA_INICIAL);
  const km = e => e._km < 10 ? fmt.format(e._km) : Math.round(e._km);
  cuerpo.replaceChildren(cerca ? el("p", { class: "fuentes-titulo", style: "margin: 10px 18px 0" }, "Más cercanas a vos") : "",
    el("ul", { class: "lista" }, ...mostrar.map(e =>
    el("li", {}, el("button", { type: "button", onclick: () => elegir(e.id, true) },
      el("span", { class: "nombre" }, e.nombre,
        el("small", {}, nombreFuente(e.fuente) + (cerca ? ` · a ${km(e)} km` : ""))),
      el("span", { class: "t" }, e.temp_c == null ? "—" : `${fmt.format(e.temp_c)}°`)))
  )), mostrar.length < lista.length ? el("p", { class: "vacio" },
    `Se muestran ${mostrar.length} de ${lista.length}. Usá la búsqueda o `,
    el("button", { type: "button", onclick: () => { estado.listaCompleta = true; dibujarLista(); } }, "ver todas")) : null);
}

function fila(nombre, valor) {
  return valor == null || valor === "" ? [] : [el("dt", {}, nombre), el("dd", {}, valor)];
}

const mm = v => `${fmt.format(v)} mm`;
const fmtDia = new Intl.DateTimeFormat("es-AR", { timeZone: ZONA, day: "numeric", month: "numeric" });

// Cada fuente informa la lluvia de períodos distintos: se muestra cada uno con su período.
function filasLluvia(e) {
  let hoy = "Lluvia del día";
  if (e.hora_utc && fmtDia.format(new Date(e.hora_utc)) === fmtDia.format(new Date())) {
    hoy = "Lluvia hoy (desde las 0 h)";
  } else if (e.hora_utc) {
    hoy = `Lluvia del ${fmtDia.format(new Date(e.hora_utc))} (hasta las ${fmtHora.format(new Date(e.hora_utc))})`;
  }
  let otro = null;
  if (e.precip_mm != null) {
    const fin = e.precip_hasta_utc ? new Date(e.precip_hasta_utc) : null;
    const hasta = !fin ? "" : fmtDia.format(fin) === fmtDia.format(new Date())
      ? ` hasta las ${fmtHora.format(fin)}` : ` hasta el ${fmtFecha.format(fin)}`;
    otro = `Lluvia en ${e.precip_horas === 1 ? "1 hora" : `${e.precip_horas} horas`}${hasta}`;
  }
  return [
    ...fila(hoy, e.precip_hoy_mm == null ? null : mm(e.precip_hoy_mm)),
    ...fila("Lluvia última hora", e.precip_1h_mm == null ? null : mm(e.precip_1h_mm)),
    ...fila("Lluvia últimas 24 h", e.precip_24h_mm == null ? null : mm(e.precip_24h_mm)),
    ...(otro ? fila(otro, mm(e.precip_mm)) : []),
  ];
}

function textoViento(e) {
  if (e.viento_kmh == null) return null;
  if (e.viento_kmh === 0) return "Calma";
  const desde = e.viento_dir_grados == null ? "variable" : `del ${rumbo(e.viento_dir_grados)}`;
  const rafaga = e.rafaga_kmh ? ` | ráfagas ${e.rafaga_kmh}` : "";
  return `${e.viento_kmh} km/h ${desde}${rafaga}`;
}

function dibujarDetalle(e) {
  const cuerpo = document.getElementById("cuerpo");
  const fuente = estado.fuentes.get(e.fuente);
  const nombre = fuente ? fuente.nombre : e.fuente;
  const enlace = enlaceSeguro(e.enlace) || enlaceSeguro(fuente && fuente.sitio);
  const obs = relativo(e.hora_utc);
  const temp = e.temp_c == null ? "—" : `${fmt.format(e.temp_c)}°`;
  cuerpo.replaceChildren(el("section", { class: "detalle" },
    el("button", { type: "button", class: "volver", onclick: () => elegir(null) }, "Volver a la lista"),
    el("h2", {}, e.nombre),
    el("p", { class: "sub" }, "Fuente: ", enlace ? enlaceExterno(enlace, nombre) : nombre),
    el("p", { class: obs.viejo ? "sub viejo" : "sub" }, obs.viejo ? `${obs.texto}. Dato desactualizado.` : obs.texto),
    el("div", { class: "grande" },
      el("span", { class: "temp", style: `--c:${colorTemp(e.temp_c) || "inherit"}` }, temp),
      el("div", {},
        el("div", { class: "cielo" }, e.cielo || ""),
        e.sensacion_c != null ? el("div", { class: "sens" }, `Sensación ${fmt.format(e.sensacion_c)}°`) : null)),
    el("dl", { class: "datos" },
      ...fila("Viento", textoViento(e)),
      ...fila("Punto de rocío", e.rocio_c == null ? null : `${fmt.format(e.rocio_c)} °C`),
      ...fila("Humedad", e.humedad_pct == null ? null : `${fmt.format(e.humedad_pct)} %`),
      ...fila("Presión", e.presion_hpa == null ? null : `${fmt.format(e.presion_hpa)} hPa`),
      ...filasLluvia(e),
      ...fila("Visibilidad", e.visibilidad),
      ...fila("Fenómenos", e.fenomenos),
      ...fila("Altura", e.altura_m == null ? null : `${fmt.format(e.altura_m)} m`),
      ...fila("Ubicación", `${e.lat.toFixed(3)}, ${e.lon.toFixed(3)}`)),
    e.crudo ? el("div", { class: "crudo" }, e.crudo) : null,
    enlace ? el("p", { class: "origen" }, enlaceExterno(enlace,
      enlaceSeguro(e.enlace) ? `Ver esta estación en ${nombre}` : `Ir al sitio de ${nombre}`)) : null
  ));
  cuerpo.scrollTop = 0;
  panel.classList.add("con-detalle");
}

// El detalle de una estación queda en el historial: el botón "atrás" del celular vuelve
// a la lista en vez de salir del sitio, y el enlace (#estacion=…) se puede compartir.
const HASH = "#estacion=";
function idDelHash() {
  return location.hash.startsWith(HASH) ? decodeURIComponent(location.hash.slice(HASH.length)) : null;
}
function anotarHistorial(id) {
  const enDetalle = history.state && history.state.estacion;
  if (id) {
    const url = HASH + encodeURIComponent(id);
    enDetalle ? history.replaceState({ estacion: id }, "", url) : history.pushState({ estacion: id }, "", url);
  } else if (enDetalle) {
    history.back();  // el popstate termina de volver a la lista
    return false;
  } else if (location.hash.startsWith(HASH)) {
    history.replaceState(null, "", location.pathname + location.search);
  }
  return true;
}
window.addEventListener("popstate", () => {
  const id = idDelHash();
  elegir(id && estado.porId.has(id) ? id : null, Boolean(id), false);
});

function elegir(id, volar, historial = true) {
  if (historial && !anotarHistorial(id)) return;
  estado.elegida = id;
  const e = id && estado.porId.get(id);
  if (e) {
    dibujarDetalle(e);
    if (movil.matches) {
      document.activeElement.blur();  // cierra el teclado si se eligió desde la búsqueda
      if (panel.dataset.hoja !== "media") hoja("media");
    }
    if (volar) {
      centrar([e.lat, e.lon], Math.max(mapa.getZoom(), 9));
    } else if (movil.matches) {
      // Si el punto quedaría debajo de la hoja, se corre el mapa para verlo.
      const y = mapa.latLngToContainerPoint([e.lat, e.lon]).y;
      const limite = window.innerHeight - altoHoja() - 40;
      if (y > limite) mapa.panBy([0, y - limite + 60]);
    }
  } else {
    estado.elegida = null;
    dibujarLista();
  }
  dibujarMapa();
}

function redibujar() {
  dibujarEstado();
  dibujarFuentes();
  dibujarMapa();
  const e = estado.elegida && estado.porId.get(estado.elegida);
  e ? dibujarDetalle(e) : (estado.elegida = null, dibujarLista());
}

async function cargar(forzar = false) {
  clearTimeout(estado.reintento);
  forzar = forzar && CON_SERVIDOR;
  const nodo = document.getElementById("estado");
  if (forzar || !estado.datos) {
    nodo.className = "estado";
    nodo.textContent = forzar ? "Consultando las fuentes…" : "Cargando datos…";
  }
  try {
    // no-cache: el navegador revalida con el ETag y, si no hay datos nuevos, el
    // servidor contesta 304 sin reenviar nada.
    const r = await fetch(URL_DATOS + (forzar ? "?actualizar=1" : ""), { cache: "no-cache" });
    if (!r.ok) throw new Error(`el servidor respondió ${r.status}`);
    const etag = r.headers.get("ETag");
    if (!etag || etag !== estado.etag) {
      const datos = await r.json();
      prepararDatos(datos);
      const primeraVez = !estado.datos;
      estado.datos = datos;
      estado.etag = etag;
      redibujar();
      const id = primeraVez && idDelHash();
      if (id && estado.porId.has(id)) {
        // Enlace directo a una estación: "atrás" vuelve a la lista, no afuera del sitio.
        history.replaceState(null, "", location.pathname + location.search);
        elegir(id, true);
      }
    } else {
      dibujarEstado();
    }
    // Mientras haya fuentes actualizándose, se vuelve a pedir en unos segundos.
    if (estado.datos.fuentes.some(f => f.cargando)) estado.reintento = setTimeout(cargar, REINTENTO_CARGANDO_MS);
  } catch (err) {
    nodo.className = "estado error";
    nodo.textContent = `No se pudieron cargar los datos (${err.message}).` +
      (CON_SERVIDOR ? " Revisá que servidor.py siga corriendo." : " Se reintenta en unos minutos.");
  }
}

let esperaBusqueda;
document.getElementById("buscar").addEventListener("input", ev => {
  clearTimeout(esperaBusqueda);
  esperaBusqueda = setTimeout(() => {
    estado.filtro = ev.target.value;
    if (!estado.datos) return;
    if (estado.elegida && history.state && history.state.estacion) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    estado.elegida = null;
    estado.listaCompleta = false;
    dibujarLista();
    dibujarMapa();
  }, 150);
});
// "Buscar" en el teclado del celular lo cierra para dejar ver los resultados.
document.getElementById("buscar").addEventListener("keydown", ev => {
  if (ev.key === "Enter") ev.target.blur();
});
document.getElementById("actualizar").addEventListener("click", () => cargar(true));
document.getElementById("buscar").addEventListener("focus", () => hoja("alta"));
// En la computadora el listado de fuentes arranca abierto; en el celular (o acostado), cerrado.
const compacto = matchMedia("(max-width: 700px), (max-height: 500px)");
document.getElementById("fuentes-caja").open = !compacto.matches;
compacto.addEventListener("change", () => {
  document.getElementById("fuentes-caja").open = !compacto.matches;
});
movil.addEventListener("change", () => {
  panel.style.height = "";
});

// --- Estaciones cerca mío ---
(() => {
  const boton = document.getElementById("cerca");
  if (!("geolocation" in navigator) || !window.isSecureContext) return;
  boton.hidden = false;
  let punto = null, radio = null;
  boton.addEventListener("click", () => {
    boton.setAttribute("aria-busy", "true");
    navigator.geolocation.getCurrentPosition(pos => {
      boton.removeAttribute("aria-busy");
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      estado.ubicacion = [lat, lon];
      if (!punto) {
        radio = L.circle([lat, lon], { radius: accuracy, color: "#1a73e8", weight: 1, fillOpacity: .1, interactive: false }).addTo(mapa);
        punto = L.marker([lat, lon], { icon: L.divIcon({ className: "yo", iconSize: [18, 18] }),
                                        interactive: false, keyboard: false, zIndexOffset: 3000 }).addTo(mapa);
      } else {
        radio.setLatLng([lat, lon]).setRadius(accuracy);
        punto.setLatLng([lat, lon]);
      }
      if (estado.elegida) elegir(null);
      else if (estado.datos) dibujarLista();
      if (movil.matches && panel.dataset.hoja === "baja") hoja("media");
      centrar([lat, lon], Math.max(mapa.getZoom(), 10));
    }, err => {
      boton.removeAttribute("aria-busy");
      const nodo = document.getElementById("estado");
      nodo.className = "estado error";
      nodo.textContent = err.code === err.PERMISSION_DENIED
        ? "No hay permiso para usar tu ubicación. Activalo en el navegador para ver las estaciones cercanas."
        : "No se pudo obtener tu ubicación. Probá de nuevo en un rato.";
    }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 5 * 60 * 1000 });
  });
})();
